<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#080d16" />
    <title>RB22 2026 · Monoplace 3D interactive</title>
    <meta name="description" content="Explorez en 3D une reconstruction de la monoplace 2026 de Max Verstappen et téléchargez son modèle GLB." />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23080d16'/%3E%3Cpath d='M10 42 35 15h12L26 42Z' fill='%23ffcc25'/%3E%3Cpath d='M25 48 46 23l8 8-16 17Z' fill='%23e31d2e'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./styles.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "./vendor/three/build/three.module.js"
        }
      }
    </script>
    <script type="module" src="./main.js"></script>
  </head>
  <body>
    <main class="viewer" id="viewer">
      <canvas id="scene" aria-label="Modèle 3D de la monoplace" role="img"></canvas>

      <header class="masthead">
        <div class="identity">
          <span class="identity-mark" aria-hidden="true">03</span>
          <div>
            <p class="eyebrow">MONOPLACE 3D</p>
            <h1>RB22 <span>2026</span></h1>
          </div>
        </div>
        <div class="masthead-actions">
          <a class="scene-link" href="./monza/">Explorer Monza <span aria-hidden="true">↗</span></a>
          <span class="file-pill">ASSET WEB <span class="pill-dot"></span> GLB</span>
        </div>
      </header>

      <div class="status" id="status" role="status" aria-live="polite">
        <div class="status-glow" aria-hidden="true"></div>
        <div class="status-card">
          <span class="status-icon" id="status-icon" aria-hidden="true"></span>
          <p class="status-kicker" id="status-kicker">CHARGEMENT DU MODÈLE</p>
          <p class="status-message" id="status-message">Préparation de la scène 3D…</p>
          <div class="progress-track" id="progress-track" aria-hidden="true">
            <div class="progress-fill" id="progress-fill"></div>
          </div>
          <p class="status-detail" id="status-detail">Le premier chargement peut prendre quelques instants.</p>
        </div>
      </div>

      <footer class="toolbar">
        <div class="gesture-hint">
          <span class="gesture-icon" aria-hidden="true">↔</span>
          <span>Glisser pour tourner <i>·</i> Molette pour zoomer</span>
        </div>
        <div class="toolbar-actions">
          <button type="button" id="spin" disabled aria-pressed="false">Rotation auto</button>
          <button type="button" id="reset" disabled>Vue initiale</button>
          <a href="./rb22_max_verstappen_2026.glb?v=20260924-2" download>Télécharger le GLB <span aria-hidden="true">↗</span></a>
        </div>
      </footer>
    </main>
    <script>
      if (location.protocol === 'file:') {
        document.getElementById('status-kicker').textContent = 'SERVEUR LOCAL REQUIS';
        document.getElementById('status-message').textContent = 'Ouvrez cette page depuis localhost.';
        document.getElementById('status-detail').textContent = 'Dans le dossier viewer, lancez : node serve.mjs';
        document.getElementById('progress-track').hidden = true;
      }
    </script>
  </body>
</html>
